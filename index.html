<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Snake - O Jogo da Cobrinha Numérica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>MATH SNAKE</h1>
            <div id="scoreboard">Valor da Cobra: <span id="snakeValue">5</span> | Recorde: <span id="highscore">5</span></div>
        </header>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="start-screen" class="overlay">
                <h2>TOQUE PARA JOGAR</h2>
                <p>Coma apenas números menores que o seu!</p>
            </div>
            <div id="gameover-screen" class="overlay hidden">
                <h2>QUEBROU! (GAME OVER)</h2>
                <p>Sua alavancagem era menor que o ativo.</p>
                <p style="font-size: 0.8rem; margin-top: 10px; color: #38bdf8;">Toque para reiniciar</p>
            </div>
        </div>

        <div id="controls">
            <div class="control-row">
                <button class="control-btn" onclick="mudarDirecao('UP')">⬆️</button>
            </div>
            <div class="control-row">
                <button class="control-btn" onclick="mudarDirecao('LEFT')">⬅️</button>
                <button class="control-btn" onclick="mudarDirecao('DOWN')">⬇️</button>
                <button class="control-btn" onclick="mudarDirecao('RIGHT')">➡️</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
